<div class="container">
  <div class="row screen d-flex flex-row post justify-content-between " style="padding: 0; margin: 0;">
    <!-- below div is for the title of news articles  -->
    <div class="col-md-3">
      <!-- In the below div first used  (mouseenter)="func()" (mouseleave)="hideArticle()" for hoover  -->
      <div class="row ">
        <a class=" news-title-anchor-link topics" style="text-align: center;" [routerLink]="['/newstartica/category','latest']">
          <span>LATEST</span>
          <span class="carousel-control-next-icon" style="color: black;"></span>
        </a>
      </div>
      <div class="row">
        <div class="col-6" *ngFor="let item of news_items.slice(0,6)">
          <div class="card my-1" style=" border: none; word-wrap: break-word;">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap"
              style="width:100%;height:100%;object-fit:cover;">
            <div class="card-body " style="overflow: hidden; font-size: 13px;">
              <a href="#" (click)="clickedArticle($event,item)"
                class="card-text news news-title-anchor-link">{{item.title}}</a>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <a class="news-title-anchor-link topics" style="text-align: center  ;"
          [routerLink]="['/newstartica/category','finance']">FINANCE</a>
      </div>
      <div class="row">
        <div class="col-6" *ngFor="let item of news_items.slice(0,6)">
          <div class="card my-1" style="border: none;">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap">
            <div class="card-body" style="overflow: hidden; font-size: 13px;">
              <a href="#" (click)="clickedArticle($event,item)"
                class="card-text news news-title-anchor-link">{{item.title}}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 
  To enable the stick property of second column such that it will remain below navigation bar and when scrolled down will remain on top.
  1. first we need to make the main column's postion relative such that eveything inside it will change relative to it.
  2. make the inner column stick so it will be stick according to its parent column. -->
    <div class="col-md-5 second-column">
      <div class="news-container" #newsContainer>
        <div class="text-center">
          <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicators">
              <li *ngFor="let item of news_items.slice(0,4); let i = index" [class.active]="i === 0"
                [attr.data-target]="'#carouselExampleCaptions'" [attr.data-slide-to]="i">
              </li>
            </ol>
            <div class="carousel-inner">
              <div *ngFor="let item of news_items.slice(0,4); let i = index" class="carousel-item"
                [ngClass]="{'active': i === 0}">
                <img [src]="getImageURL(item.image)" class="d-block w-100 blurred-image" alt="...">
                <div class="carousel-caption d-none d-md-block news-title-anchor-link" style="color:white;z-index: 2;">
                  <h4 style="font-size: 30px; font-weight:800">{{ item.title }}</h4>
                </div>
              </div>
            </div>
            <a class="carousel-control-prev" href="#carouselExampleCaptions" role="button" data-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleCaptions" role="button" data-slide="next">
              <span class="sr-only">Next</span>
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </div>
      <div class="row" style="border-bottom: dotted 1px black">
        <Span class="news-title-anchor-link topics" [routerLink]="['/newstartica/category','markets']">MARKETS</Span>
        <div class="col-sm-4 d-flex flex-column  flex-wrap">
          <div class="card my-1 card-dimension mid-news" style=" border: none;" *ngFor="let item of news_items.slice(0,2)">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap">
            <div class="card-body" style="overflow: hidden; font-size: 13px;">
              <a href="" (click)="clickedArticle($event,item)" class="card-text news news-title-anchor-link">
                {{item.title}}
              </a>
            </div>
          </div>
        </div>
        <div class="col-sm-7" style="height: 100%; ">
          <div class="card my-1 card-dimension" style=" border: none;" *ngFor="let item of news_items.slice(0,1)">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap">
            <div class="card-body" style="overflow: hidden; font-size: 13px;">
              <a href="" (click)="clickedArticle($event,item)" class="card-text news news-title-anchor-link test" style="font-size:25px">
                {{item.title}}
              </a>
            </div>
          </div>
          <div class="card my-1 card-dimension" style="font-family:'Poppins';font-weight:300 ;border: none; border-top: dotted 1px black"
            *ngFor="let item of news_items.slice(0,3)" >
            {{item.title}}
          </div>
        </div>
      </div>
      <!-- MIDDLE COL: POLITICS  -->
      <div class="row" style="border-bottom: dotted 1px black">
        <Span class="news-title-anchor-link topics" [routerLink]="['/newstartica/category','politics']">POLITICS</Span>
        <div class="col">
          <div class="card d-flex flex-row my-1 card-dimension mid-news" style=" border: none;"
            *ngFor="let item of news_items.slice(0,1)">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap">
            <div class="card-body" style="overflow: hidden;">
              <a href="" (click)="clickedArticle($event,item)" class="card-text news news-title-anchor-link test" style="font-size: 30px;">
                {{item.title}}
              </a>
            </div>
          </div>
          <div class="card my-1" style=" border: none;" *ngFor="let item of news_items.slice(0,4)">
            <div style="border-top: dotted 1px black; font-family:'Poppins';font-weight:300 ;">{{item.title}} <a style="text-decoration: none;" href="">></a></div>
          </div>
        </div>
      </div>
      <!-- MIDDLE COLUMN : ADVERTISEMENT -->
      <div class="row d-flex" style=" align-self: flex-end;   position: relative;bottom:0; border: solid red 3px;">
        <!-- <img [src]="getImageURL(item.image)" *ngFor="let item of news_items.slice(0,1)" class="d-block w-100 blurred-image" alt="..."> -->
      </div>
    </div>
    <div class="col-md-3">
      <div class="row justify-content-center text-center">
        <div class="col-5">

          <a class="news-title-anchor-link topics" [routerLink]="['/newstartica/category', 'top-news']">TOP NEWS</a>
        </div>
      </div>
      <div class="row" style="border-bottom: dotted 1px black">
        <div class="col-6" *ngFor="let item of news_items.slice(0,4)">
          <div class="card my-1" style=" border: none;">
            <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap">
            <div class="card-body" style="overflow: hidden; font-size: 13px;">
              <a href="" (click)="clickedArticle($event,item)" class="card-text news news-title-anchor-link">
                {{item.title}}
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-2 row justify-content-center text-center">
        <div class="col-sm-5">
          <a class="news-title-anchor-link topics" [routerLink]="['/newstartica/category', 'sports']">SPORTS</a>
        </div>
      </div>
      <div class="row d-flex flex-row mb-4" *ngFor="let item of sports_news.slice(0,4)">
        <div class="col-4" style="height: 50px">
          <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap"
            style="border-radius: 4px;width:100%;height:100%;object-fit:fill;">
        </div>
        <div class="col-8 sports-column">
          <a href="#" (click)="clickedArticle($event,item)"
            class="card-text news news-title-anchor-link">{{item.title}}</a>
        </div>
      </div>

      <div class="mt-2 row justify-content-center text-center" style="border-top: dotted 1px black">
        <div class="col-sm-5">
          <a class="news-title-anchor-link topics" [routerLink]="['/newstartica/category', 'entertainment']">ENTERTAINMENT</a>
        </div>
      </div>
      <div class="row d-flex flex-row mb-4" *ngFor="let item of sports_news.slice(0,4)">
        <div class="col-4" style=" height: 50px; ">
          <img class="card-img-top" [src]="getImageURL(item.image)" alt="Card image cap"
            style="border-radius: 4px;width:100%;height:100%;object-fit:fill;">
        </div>
        <div class="col-8 sports-column" style="text-wrap: wrap; text-overflow: ellipsis;">
          <a href="#" (click)="clickedArticle($event,item)"
            class="card-text news news-title-anchor-link">{{item.title}}</a>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row"></div>
<!-- Modal Logic -->
